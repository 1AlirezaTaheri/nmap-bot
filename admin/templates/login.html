<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — NetSentinel Admin</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>NetSentinel</h1>
    <p class="sub">Admin panel</p>

    {% if error %}
    <div class="flash bad">{{ error }}</div>
    {% endif %}

    <form method="post" action="/api/login">
      <input type="hidden" name="next" value="{{ next }}">

      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username"
               required autofocus>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>
      </div>

      <button type="submit" style="width:100%">Sign in</button>
    </form>

    <p class="hint" style="margin-top:14px">
      Sessions use an HttpOnly cookie. Five failed attempts per minute per
      IP are throttled and audited.
    </p>
  </div>
</div>

<script>
// The login form posts JSON to /api/login; adapt the native form.
document.querySelector('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const body = {
    username: f.username.value,
    password: f.password.value,
  };
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (res.ok) {
      window.location.href = f.next.value || '/admin';
    } else {
      const data = await res.json().catch(() => ({}));
      document.querySelector('.flash')?.remove();
      const div = document.createElement('div');
      div.className = 'flash bad';
      div.textContent = data.detail || 'Sign-in failed.';
      f.parentNode.prepend(div);
    }
  } catch {
    window.location.href = '/admin/login?error=Network+error';
  }
});
</script>
</body>
</html>
