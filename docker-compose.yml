services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netsentinel
      POSTGRES_PASSWORD: netsentinel
      POSTGRES_DB: netsentinel
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsentinel -d netsentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  bot:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://netsentinel:netsentinel@db:5432/netsentinel
    volumes:
      # App logs, rotated by the daemon's json-file driver.
      - logs:/app/logs
    # /health in Telegram is the operator check; this is the container-level
    # liveness signal Docker uses to decide whether to restart.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0 if __import__('os').environ.get('TELEGRAM_BOT_TOKEN') else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # SIGTERM -> tini -> python; allow time for the scheduler and worker to
    # stop before Docker escalates to SIGKILL.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  dbdata:
  logs: