services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netsentinel
      POSTGRES_PASSWORD: netsentinel
      POSTGRES_DB: netsentinel
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsentinel -d netsentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://netsentinel:netsentinel@db:5432/netsentinel
    volumes:
      - logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0 if __import__('os').environ.get('TELEGRAM_BOT_TOKEN') else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://netsentinel:netsentinel@db:5432/netsentinel
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 8080
    ports:
      # Bound to localhost only: the panel has no TLS of its own, so
      # publishing it on every interface would expose admin credentials
      # over plain HTTP. Put a reverse proxy with TLS in front for remote
      # access, and set ADMIN_COOKIE_SECURE=true behind it.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health',
          timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    stop_grace_period: 20s
    restart: unless-stopped

  # Cloudflare quick tunnel: gives the Mini App a public HTTPS origin without
  # a domain, a certificate or port forwarding. Telegram refuses to load a
  # Mini App over plain HTTP, so *something* has to terminate TLS.
  #
  # The trycloudflare.com hostname changes whenever this container restarts.
  # Read the current one with:
  #   docker compose logs tunnel | grep -o 'https://[-a-z0-9]*.trycloudflare.com'
  # then set MINIAPP_URL to that value (no trailing slash) in .env and run:
  #   docker compose up -d --force-recreate bot admin
  tunnel:
    image: cloudflare/cloudflared:2024.10.0
    command: tunnel --no-autoupdate --url http://admin:8080
    depends_on:
      admin:
        condition: service_healthy
    restart: unless-stopped
    # No ports published: the tunnel is outbound-only, which is why it works
    # behind NAT without any firewall change.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--help"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  dbdata:
  logs: