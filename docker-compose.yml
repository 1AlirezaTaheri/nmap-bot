services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: netsentinel
      POSTGRES_PASSWORD: netsentinel
      POSTGRES_DB: netsentinel
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netsentinel -d netsentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://netsentinel:netsentinel@db:5432/netsentinel
    volumes:
      - logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0 if __import__('os').environ.get('TELEGRAM_BOT_TOKEN') else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://netsentinel:netsentinel@db:5432/netsentinel
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 8080
    ports:
      # Bound to localhost only: the panel has no TLS of its own, so
      # publishing it on every interface would expose admin credentials
      # over plain HTTP. Put a reverse proxy with TLS in front for remote
      # access, and set ADMIN_COOKIE_SECURE=true behind it.
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health',
          timeout=5).status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    stop_grace_period: 20s
    restart: unless-stopped

  # Cloudflare quick tunnel: gives the Mini App a public HTTPS origin without
  # a domain, a certificate or port forwarding. Telegram refuses to load a
  # Mini App over plain HTTP, so *something* has to terminate TLS.
  #
  # The trycloudflare.com hostname changes whenever this container restarts.
  # Read the current one with:
  #   docker compose logs tunnel | grep -o 'https://[-a-z0-9]*.trycloudflare.com'
  # then set MINIAPP_URL to that value (no trailing slash) in .env and run:
  #   docker compose up -d --force-recreate bot admin
  tunnel:
    image: cloudflare/cloudflared:2024.10.0
    # --protocol http2 is deliberate. QUIC (UDP 7844) fails on this network:
    # the connector registered once at startup and then logged 486 failed
    # QUIC attempts with 'timeout: no recent network activity', never
    # falling back on its own. HTTP/2 over TCP registers immediately and
    # has stayed up across repeated external requests. cloudflared fixes
    # the protocol at startup, so this cannot be changed without a restart.
    command: tunnel --no-autoupdate --protocol http2 --url http://admin:8080
    depends_on:
      admin:
        condition: service_healthy
    restart: unless-stopped
    # No ports published: the tunnel is outbound-only, which is why it works
    # behind NAT without any firewall change.
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--help"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Caddy: TLS termination in front of the admin panel.
  #
  # The application speaks only plain HTTP, which is acceptable inside the
  # Docker network but not for anything a browser touches -- the session
  # cookie and bearer token would cross the wire in clear text. Caddy gives
  # the panel an HTTPS origin on the LAN.
  #
  # Certificates come from Caddy's internal CA (see Caddyfile), because there
  # is no public domain for this host. A client has to be given that root
  # before the browser stops warning; the instructions are in the Caddyfile.
  #
  # The tunnel deliberately keeps pointing at admin:8080 rather than at
  # Caddy. cloudflared already presents a valid public certificate to the
  # internet, and routing its origin leg through a self-signed one would add
  # --noTLSVerify or an untrusted CA to the tunnel for no gain.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      admin:
        condition: service_healthy
    networks:
      default:
        # Fixed address, not a dynamic lease. Caddy has to serve a
        # certificate covering its own container IP: a client connecting to
        # an IP literal sends no SNI, so Caddy falls back to the address the
        # connection arrived on and finds no match without it. A dynamic
        # address would break that certificate on every container recreate.
        #
        # 172.18.0.6 must stay in step with the SAN list in the Caddyfile.
        ipv4_address: 172.18.0.6
    ports:
      # Loopback only. Publishing 8443 on every interface would expose a
      # self-signed TLS endpoint directly on the LAN; SSH tunnelling to this
      # port keeps the current access path working over real TLS.
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Both are writable: Caddy stores the internal CA and its keys here.
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # Caddy binds :8443. NET_BIND_SERVICE is not required above 1024, but
      # it is harmless and keeps the file correct if the port ever changes.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # read_only leaves Caddy nowhere to write its temporary files.
      - /tmp:size=16m
    healthcheck:
      # The admin API on 2019 answers only from inside the container, which
      # is what this check needs. `wget --spider` on /config/ returns 200
      # when Caddy's config has been loaded and the server is up.
      #
      # This is deliberately NOT `caddy validate`: that checks the Caddyfile
      # syntax on disk and exits 0 even when the running server has failed to
      # bind or the config was never applied, which is how the tunnel's
      # healthcheck came to report healthy through a 17-hour outage.
      #
      # 127.0.0.1, not localhost: the admin API binds IPv4 loopback only,
      # while BusyBox wget resolves `localhost` to [::1] first and does not
      # fall back. With `localhost` the probe always got "Connection
      # refused" from ::1 while the endpoint was healthy on 127.0.0.1, so
      # the container never left "health: starting".
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s


volumes:
  dbdata:
  logs:

  # Caddy's internal CA private key and issued certificates.
  # Removing this volume invalidates every certificate it has issued,
  # so clients that were given the old root have to be re-trusted.
  caddy_data:
  # Caddy's runtime configuration, including the admin API bind address.
  caddy_config:

networks:
  default:
    # Pinned so caddy's ipv4_address above is honoured and stable.
    # Without an explicit subnet Docker picks one, and the address
    # hard-coded to match the Caddyfile SAN list would no longer apply.
    ipam:
      config:
        - subnet: 172.18.0.0/16
